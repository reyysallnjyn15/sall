<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rumahku Istanaku</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background-color:#f5f5f5;
        }

        /* Navbar */
        .navbar-custom{
            background:#011115bf;
            padding:15px 40px;
            box-shadow:0 5px 15px #011115bf;
        }

        /* Logo */ 
        .logo{
            width:55px;
            height:55px;
            border-radius:50%;
            object-fit:cover;
            border:2px solid white;
        }

        /* Judul */
        .judul{
            font-size:28px;
            font-weight:bold;
            margin-left:10px;
            color:white;
        }

        .judul span{
            color:#0d6efd;
        }

        /* Search */
        .search-box{
            width:260px;
            border-radius:30px;
        }

        .btn-search{
            border-radius:30px;
            margin-left:8px;
            padding:8px 20px;
        }

        /* Login */
        .btn-login{
            border-radius:30px;
            padding:8px 25px;
            margin-left:15px;
        }

        /* Hover */
        .btn-login:hover,
        .btn-search:hover{
            transform:scale(1.05);
            transition:.3s;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-custom">
    <div class="container-fluid">

        <!-- Logo -->
        <a class="navbar-brand d-flex align-items-center" href="#">
            <img src="download.jpg" class="logo">
            <span class="judul">
                RUMAHKU <span>ISTANAKU</span>
            </span>
        </a>

        <!-- Search + Login -->
        <div class="d-flex align-items-center">

            <form class="d-flex">
                <input class="form-control search-box" type="search" placeholder="Cari rumah impian...">
                <button class="btn btn-primary btn-search" type="submit">
                    🔍 Search
                </button>
            </form>

    
           <button class="btn btn-primary btn-login">
    👤 Login
</button>

        </div>

    </div>
</nav>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
